name: Format Phase 1 files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply pinned formatter
        run: >-
          ruff format
          game/core/accessibility.py
          game/core/audio.py
          game/core/camera.py
          game/core/engine.py
          game/core/presentation.py
          game/core/settings.py
          tools/phase1_quality_audit.py
          tests/test_phase1_runtime.py
          tests/test_phase1_quality.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-phase1-${{ github.sha }}
          path: |
            game/core/accessibility.py
            game/core/audio.py
            game/core/camera.py
            game/core/engine.py
            game/core/presentation.py
            game/core/settings.py
            tools/phase1_quality_audit.py
            tests/test_phase1_runtime.py
            tests/test_phase1_quality.py
          if-no-files-found: error
