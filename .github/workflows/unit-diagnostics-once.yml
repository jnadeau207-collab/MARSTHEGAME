name: Unit diagnostics once

on:
  push:
    branches: [agent/phase2-relay-echo-promotion]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record promotion unit diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-relay-echo-promotion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit suite and capture failures
        run: |
          python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
          set +e
          python -m unittest discover -s tests -v > /tmp/unit-tests.log 2>&1
          status=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_status=${status}"
            echo
            tail -n 240 /tmp/unit-tests.log
          } > diagnostics/promotion-unit-failures.txt
      - name: Commit diagnostic transcript
        env:
          BRANCH: agent/phase2-relay-echo-promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/promotion-unit-failures.txt
          git commit -m "Record promotion unit diagnostics"
          git push origin "HEAD:${BRANCH}"
