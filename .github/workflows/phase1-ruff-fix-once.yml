name: Phase 1 Ruff fix once

on:
  push:
    branches: [agent/phase1-aaa-slice-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-ruff-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-aaa-slice-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply exact lint and format fixes
        run: |
          ruff check --fix \
            game/core/particles.py \
            game/entities/collectible.py \
            game/entities/enemy.py \
            game/entities/mars_sentinel.py \
            game/entities/player.py \
            game/scenes/chapter_select.py \
            game/scenes/level.py
          ruff format \
            game/core/particles.py \
            game/entities/collectible.py \
            game/entities/enemy.py \
            game/entities/mars_sentinel.py \
            game/entities/player.py \
            game/scenes/chapter_select.py \
            game/scenes/level.py
      - name: Commit exact Ruff output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/core/particles.py game/entities/collectible.py game/entities/enemy.py game/entities/mars_sentinel.py game/entities/player.py game/scenes/chapter_select.py game/scenes/level.py
          git commit -m "Fix Phase 1 lint findings [phase1-ruff-fix]"
          git push origin HEAD:agent/phase1-aaa-slice-foundation
