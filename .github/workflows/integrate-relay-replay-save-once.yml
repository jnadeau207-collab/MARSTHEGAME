name: Integrate Relay Echo replay save once

on:
  push:
    branches: [agent/phase2-relay-echo-replay-reset]
    paths: [.github/workflows/integrate-relay-replay-save-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-relay-echo-replay-reset
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate replay archive into save envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("game/core/save.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "from game.core.relay_echo_state import RELAY_ECHO_RUNTIME, RelayEchoStateError\n",
                  "from game.core.relay_echo_replay import (\n    RelayEchoReplayError,\n    default_relay_echo_replay,\n    normalize_relay_echo_replay,\n)\nfrom game.core.relay_echo_state import RELAY_ECHO_RUNTIME, RelayEchoStateError\n",
              ),
              (
                  "        self.relay_echo = RELAY_ECHO_RUNTIME.default_state()\n        self.settings_volume = 0.7\n",
                  "        self.relay_echo = RELAY_ECHO_RUNTIME.default_state()\n        self.relay_echo_replay = default_relay_echo_replay()\n        self.settings_volume = 0.7\n",
              ),
              (
                  '''        self._validate_relay_campaign_boundary(relay_echo, campaign)
              return {
          ''',
                  '''        self._validate_relay_campaign_boundary(relay_echo, campaign)
              try:
                  relay_echo_replay = normalize_relay_echo_replay(
                      data.get("relay_echo_replay")
                  )
              except RelayEchoReplayError as exc:
                  raise ValueError(f"Relay Echo replay archive is invalid: {exc}") from exc
              if (
                  relay_echo_replay["completed_runs"]
                  and "relay_echo" not in campaign["completed_missions"]
              ):
                  raise ValueError(
                      "Relay Echo archived runs require durable campaign completion"
                  )
              return {
          ''',
              ),
              (
                  '''            "campaign": campaign,
                  "relay_echo": relay_echo,
                  "settings_volume": self._bounded_float(
          ''',
                  '''            "campaign": campaign,
                  "relay_echo": relay_echo,
                  "relay_echo_replay": relay_echo_replay,
                  "settings_volume": self._bounded_float(
          ''',
              ),
              (
                  '''        self.campaign = CAMPAIGN_GRAPH.normalize_state(state["campaign"])
              self.relay_echo = RELAY_ECHO_RUNTIME.normalize_state(state["relay_echo"])
              self.settings_volume = state["settings_volume"]
          ''',
                  '''        self.campaign = CAMPAIGN_GRAPH.normalize_state(state["campaign"])
              self.relay_echo = RELAY_ECHO_RUNTIME.normalize_state(state["relay_echo"])
              self.relay_echo_replay = normalize_relay_echo_replay(
                  state["relay_echo_replay"]
              )
              self.settings_volume = state["settings_volume"]
          ''',
              ),
              (
                  '''            "campaign": CAMPAIGN_GRAPH.normalize_state(self.campaign),
                  "relay_echo": RELAY_ECHO_RUNTIME.normalize_state(self.relay_echo),
                  "settings_volume": self.settings_volume,
          ''',
                  '''            "campaign": CAMPAIGN_GRAPH.normalize_state(self.campaign),
                  "relay_echo": RELAY_ECHO_RUNTIME.normalize_state(self.relay_echo),
                  "relay_echo_replay": normalize_relay_echo_replay(
                      self.relay_echo_replay
                  ),
                  "settings_volume": self.settings_volume,
          ''',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"save integration point missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install ruff==0.16.0
          ruff check --fix game/core/save.py
          ruff format game/core/save.py
      - name: Commit production integration and remove helper
        env:
          BRANCH: agent/phase2-relay-echo-replay-reset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/integrate-relay-replay-save-once.yml
          git add game/core/save.py
          git commit -m "Persist Relay Echo replay archive" || exit 0
          git push origin "HEAD:${BRANCH}"
