name: Phase 1 transition fix final

on:
  push:
    branches: [agent/phase1-aaa-slice-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-transition-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-aaa-slice-foundation
      - name: Make completion transition idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('game/scenes/vertical_slice.py')
          text = path.read_text(encoding='utf-8')
          text, count1 = text.replace(
              '        self.slice_complete = False\n        self.completion_timer = 0.0\n        self._landing_y = 790.0\n',
              '        self.slice_complete = False\n        self.completion_timer = 0.0\n        self.completion_transitioned = False\n        self._landing_y = 790.0\n',
              1,
          ), 1
          old = '        self.slice_complete = False\n        self.completion_timer = 0.0\n        self.won = False\n'
          if old not in text:
              raise SystemExit('on_enter anchor missing')
          text = text.replace(
              old,
              '        self.slice_complete = False\n        self.completion_timer = 0.0\n        self.completion_transitioned = False\n        self.won = False\n',
              1,
          )
          old = '            if self.completion_timer > 300:\n                self.engine.go_title()\n'
          if old not in text:
              raise SystemExit('transition block missing')
          text = text.replace(
              old,
              '            if self.completion_timer > 300 and not self.completion_transitioned:\n                self.completion_transitioned = True\n                self.engine.go_title()\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          grep -n "completion_transitioned" game/scenes/vertical_slice.py
      - name: Commit isolated transition fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/scenes/vertical_slice.py
          git commit -m "Make Phase 1 completion transition idempotent [phase1-transition-final]"
          git push origin HEAD:agent/phase1-aaa-slice-foundation
