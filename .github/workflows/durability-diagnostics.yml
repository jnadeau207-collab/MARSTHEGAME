name: Durability diagnostics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture complete test transcript
        run: |
          mkdir -p build
          python -m unittest discover -s tests -v > build/full-suite.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: full-suite-diagnostics-${{ github.sha }}
          path: build/full-suite.txt
          if-no-files-found: error
