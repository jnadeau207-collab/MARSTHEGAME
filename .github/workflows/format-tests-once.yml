name: Format tests once

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-format-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-aaa-slice-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply pinned formatter
        run: ruff format tests
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Format Phase 1 tests [ruff-format-tests]"
          git push origin HEAD:agent/phase1-aaa-slice-foundation
