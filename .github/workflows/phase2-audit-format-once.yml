name: Phase 2 audit format once

on:
  push:
    branches: [agent/phase2-campaign-foundation]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-audit-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-campaign-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply exact audit formatting
        run: ruff format tools/phase2_campaign_audit.py
      - name: Commit audit format and remove helper
        run: |
          git rm .github/workflows/phase2-audit-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/phase2_campaign_audit.py
          git commit -m "Apply pinned Phase 2 audit formatting [phase2-audit-formatted]"
          git push origin HEAD:agent/phase2-campaign-foundation
