name: Phase 1 final verifier

on:
  push:
    branches: [agent/phase1-aaa-slice-foundation]

permissions:
  contents: write

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-final-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-aaa-slice-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q main.py game tools tests
      - name: Static analysis
        run: >-
          ruff check
          game/core/accessibility.py
          game/core/audio.py
          game/core/camera.py
          game/core/checkpoint.py
          game/core/diagnostics.py
          game/core/engine.py
          game/core/gfx.py
          game/core/input.py
          game/core/presentation.py
          game/core/save.py
          game/core/settings.py
          game/core/timing.py
          game/data/classic_replays.py
          game/data/content.py
          game/data/ip_tracks.py
          game/data/phase1_slice.py
          game/entities/mars_sentinel.py
          game/scenes/credits.py
          game/scenes/title.py
          game/scenes/vertical_slice.py
          tools
          tests
      - name: Formatting data and replay contracts
        run: >-
          ruff format --check
          game/data/classic_replays.py
          game/data/content.py
          game/data/ip_tracks.py
          game/data/phase1_slice.py
      - name: Formatting core runtime
        run: >-
          ruff format --check
          game/core/accessibility.py
          game/core/audio.py
          game/core/camera.py
          game/core/checkpoint.py
          game/core/diagnostics.py
          game/core/engine.py
          game/core/gfx.py
          game/core/input.py
          game/core/presentation.py
          game/core/save.py
          game/core/settings.py
          game/core/timing.py
      - name: Formatting Phase 1 gameplay and scenes
        run: >-
          ruff format --check
          game/entities/mars_sentinel.py
          game/scenes/credits.py
          game/scenes/title.py
          game/scenes/vertical_slice.py
      - name: Formatting tools and tests
        run: |
          ruff format --check tools
          ruff format --check tests
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Classic Mode replay
        run: python -m tools.classic_mode_replay --json-out build/classic-mode-replay.json
      - name: Phase 1 replay
        run: python -m tools.phase1_slice_replay --json-out build/phase1-slice-replay.json
      - name: Operating and phase audits
        run: |
          python -m tools.validate_phase0_organization --json-out build/phase0-organization.json
          python -m tools.phase0_audit --json-out build/phase0-audit.json
          python -m tools.phase1_quality_audit --json-out build/phase1-quality.json
      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Same-runner performance comparison
        run: |
          mkdir -p baseline/tools build/performance
          cp tools/performance_baseline.py baseline/tools/performance_baseline.py
          touch baseline/tools/__init__.py
          (
            cd baseline
            python -m tools.performance_baseline --update-frames 90 --draw-frames 5 --warmup-rounds 2 --rounds 7 --json-out ../build/performance/base-a.json
          )
          python -m tools.performance_baseline --update-frames 90 --draw-frames 5 --warmup-rounds 2 --rounds 7 --json-out build/performance/candidate.json
          (
            cd baseline
            python -m tools.performance_baseline --update-frames 90 --draw-frames 5 --warmup-rounds 2 --rounds 7 --json-out ../build/performance/base-b.json
          )
          python -m tools.performance_guard \
            --baseline build/performance/base-a.json \
            --baseline build/performance/base-b.json \
            --candidate build/performance/candidate.json \
            --policy config/performance_thresholds.json \
            --json-out build/performance/performance-guard.json
      - name: Commit verified Phase 1 record
        env:
          VERIFIED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > docs/PHASE1_FINAL_VERIFICATION.md <<EOF
          # Phase 1 Final Verification

          Phase 1 implementation was verified at commit \`$VERIFIED_SHA\` by GitHub Actions run \`$RUN_ID\`.

          Passed:

          - Python compilation
          - pinned Ruff static-analysis and formatting gates
          - complete unit and regression test suite
          - deterministic eight-chapter Classic Mode replay
          - deterministic complete Phase 1 Mars-slice replay
          - founder + AI operating-model validation
          - Phase 0 completion audit
          - Phase 1 quality-truth audit
          - same-runner base/candidate/base performance guard

          This closes the repository-executable Phase 1 implementation boundary under the founder's instruction to proceed. It does not claim that external playtest, founder direct-play, authored-asset, or AAA-quality evidence has been completed. The machine-readable AAA claim remains \`target_not_achieved\` until those gates are genuinely satisfied.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE1_FINAL_VERIFICATION.md
          git commit -m "Record verified Phase 1 boundary [phase1-final-verified]"
          git push origin HEAD:agent/phase1-aaa-slice-foundation
