name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-branches.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            agent/phase0-foundation \
            agent/phase1-aaa-slice-foundation \
            agent/phase2-campaign-foundation
          do
            encoded=${branch//\//%2F}
            status=$(curl --silent --output /tmp/response --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")
            if [[ "$status" != "204" && "$status" != "422" && "$status" != "404" ]]; then
              cat /tmp/response
              exit 1
            fi
          done
