name: Phase 1 self-cleaning format

on:
  push:
    branches: [agent/phase1-aaa-slice-foundation]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-self-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-aaa-slice-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Format scene and remove temporary workflows
        run: |
          ruff format game/scenes/vertical_slice.py
          git rm .github/workflows/phase1-final-cleanup-once.yml
          git rm .github/workflows/phase1-self-cleaning-format.yml
      - name: Commit clean Phase 1 head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/scenes/vertical_slice.py
          git commit -m "Format Phase 1 transition and remove temporary workflows [phase1-self-clean]"
          git push origin HEAD:agent/phase1-aaa-slice-foundation
