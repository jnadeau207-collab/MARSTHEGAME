name: Format Phase 3 evidence once

on:
  push:
    branches: [agent/phase3-native-renderer-foundation]
    paths: [.github/workflows/format-phase3-evidence-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-native-renderer-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply pinned Ruff formatting
        run: |
          python -m pip install ruff==0.16.0
          ruff check --fix tools/phase3_renderer_audit.py tests/test_phase3_renderer_audit.py
          ruff format tools/phase3_renderer_audit.py tests/test_phase3_renderer_audit.py
      - name: Commit formatting and remove helper
        env:
          BRANCH: agent/phase3-native-renderer-foundation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/format-phase3-evidence-once.yml
          git add tools/phase3_renderer_audit.py tests/test_phase3_renderer_audit.py
          git commit -m "Format Phase 3 renderer evidence audit" || exit 0
          git push origin "HEAD:${BRANCH}"
