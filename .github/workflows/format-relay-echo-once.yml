name: Format Relay Echo once

on:
  push:
    branches: [agent/phase2-relay-echo-contract]
    paths:
      - .github/workflows/format-relay-echo-once.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[relay-echo-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-relay-echo-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.0
      - name: Apply canonical formatting
        run: >-
          ruff format
          game/data/campaign.py
          game/data/relay_echo.py
          tools/phase2_campaign_audit.py
          tests/test_phase2_campaign_audit.py
          tests/test_relay_echo_contract.py
      - name: Commit formatted production files and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/format-relay-echo-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game/data/campaign.py game/data/relay_echo.py tools/phase2_campaign_audit.py tests/test_phase2_campaign_audit.py tests/test_relay_echo_contract.py .github/workflows/format-relay-echo-once.yml
          git commit -m 'Format Relay Echo contract files [relay-echo-format]'
          git push origin HEAD:agent/phase2-relay-echo-contract
