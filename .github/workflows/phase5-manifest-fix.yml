name: Phase 5 Manifest Fix

on:
  push:
    branches:
      - agent/phase5-hero-sequence-recovery

permissions:
  contents: write

jobs:
  repair-manifest-schema:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-hero-sequence-recovery
          fetch-depth: 0

      - name: Expand cooked content manifest for hero meshes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $headerPath = 'native/src/assets/scene_asset.h'
          $header = Get-Content $headerPath -Raw
          $header = $header.Replace('static constexpr std::uint32_t kSchemaVersion = 1;', 'static constexpr std::uint32_t kSchemaVersion = 2;')
          $header = $header.Replace('static constexpr std::size_t kMeshCount = 4;', 'static constexpr std::size_t kMeshCount = 7;')
          Set-Content -Path $headerPath -Value $header -NoNewline -Encoding utf8

          $sourcePath = 'native/src/assets/scene_asset.cpp'
          $source = Get-Content $sourcePath -Raw
          $source = $source.Replace("constexpr std::array<char, 8> kMagic = {'M', 'A', 'R', 'S', 'C', 'N', '2', '\0'};", "constexpr std::array<char, 8> kMagic = {'M', 'A', 'R', 'S', 'C', 'N', '3', '\0'};")
          $source = $source.Replace('constexpr std::uint32_t kCookedVersion = 2;', 'constexpr std::uint32_t kCookedVersion = 3;')
          $source = $source.Replace('static_assert(sizeof(CookedHeader) == 96);', 'static_assert(sizeof(CookedHeader) == 120);')
          Set-Content -Path $sourcePath -Value $source -NoNewline -Encoding utf8

          git diff --check
          if (-not (git status --porcelain)) {
            Write-Host 'Manifest schema is already repaired.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $headerPath $sourcePath
          git commit -m 'Expand cooked manifest for hero mesh catalog'
          git push origin HEAD:agent/phase5-hero-sequence-recovery
