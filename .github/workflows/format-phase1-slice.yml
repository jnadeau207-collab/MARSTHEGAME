name: Format Phase 1 slice

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply pinned formatter
        run: >-
          ruff format
          game/core/engine.py
          game/core/save.py
          game/data/phase1_slice.py
          game/entities/mars_sentinel.py
          game/scenes/title.py
          game/scenes/vertical_slice.py
          tools/phase1_quality_audit.py
          tools/phase1_slice_replay.py
          tests/test_phase1_quality.py
          tests/test_phase1_slice.py
          tests/test_save_progression.py
      - name: Capture exact patch
        run: |
          mkdir -p build
          git diff --binary > build/phase1-slice-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-phase1-slice-${{ github.sha }}
          path: |
            build/phase1-slice-format.patch
            game/core/engine.py
            game/core/save.py
            game/data/phase1_slice.py
            game/entities/mars_sentinel.py
            game/scenes/title.py
            game/scenes/vertical_slice.py
            tools/phase1_quality_audit.py
            tools/phase1_slice_replay.py
            tests/test_phase1_quality.py
            tests/test_phase1_slice.py
            tests/test_save_progression.py
          if-no-files-found: error
