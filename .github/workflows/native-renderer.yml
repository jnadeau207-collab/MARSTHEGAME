name: Native Game CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-game:
    name: Windows C++23 / D3D12 / HLSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate DXC
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\dxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe was not found in the Windows SDK" }
          "DXC_EXECUTABLE=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure validation-enabled native game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmake -S native -B build/native -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DMARS_ENABLE_D3D12_VALIDATION=ON `
            -DDXC_EXECUTABLE="$env:DXC_EXECUTABLE" 2>&1 |
            Tee-Object -FilePath build/native-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Phase 5 native visual slice, cooker, and shaders
        shell: pwsh
        run: |
          cmake --build build/native --parallel 2>&1 |
            Tee-Object -FilePath build/native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run deterministic native gameplay, visual, audio, and asset tests
        shell: pwsh
        run: |
          ctest --test-dir build/native --output-on-failure 2>&1 |
            Tee-Object -FilePath build/native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged multi-pass shaders and scene payloads
        shell: pwsh
        run: |
          .\build\native\mars_native.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render and capture Phase 5 slice under D3D12 validation
        timeout-minutes: 3
        shell: pwsh
        run: |
          .\build\native\mars_native.exe --warp-smoke-test 2>&1 |
            Tee-Object -FilePath build/phase5-warp.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/native/phase5_visual_slice.bmp)) {
            throw "Phase 5 visual capture was not produced"
          }
      - name: Upload native game and Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-phase5-${{ github.sha }}
          path: |
            build/*.log
            build/native/mars_native.exe
            build/native/mars_scene_cooker.exe
            build/native/shaders/*.dxil
            build/native/assets/scenes/*.bin
            build/native/phase5_visual_slice.bmp
          if-no-files-found: warn
