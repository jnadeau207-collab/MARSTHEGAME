name: Native Game CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-game:
    name: Windows C++23 / D3D12 / HLSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate DXC
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\dxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe was not found in the Windows SDK" }
          "DXC_EXECUTABLE=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure validation-enabled native game
        shell: pwsh
        run: >-
          cmake
          -S native
          -B build/native
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMARS_ENABLE_D3D12_VALIDATION=ON
          -DDXC_EXECUTABLE="$env:DXC_EXECUTABLE"
      - name: Build native game and shaders
        shell: pwsh
        run: cmake --build build/native --parallel
      - name: Run deterministic native gameplay tests
        shell: pwsh
        run: ctest --test-dir build/native --output-on-failure
      - name: Verify packaged shader payload
        shell: pwsh
        run: |
          .\build\native\mars_native.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render native Ares Reach graybox under D3D12 validation
        timeout-minutes: 2
        shell: pwsh
        run: |
          .\build\native\mars_native.exe --warp-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native game evidence
        uses: actions/upload-artifact@v4
        with:
          name: mars-native-game-${{ github.sha }}
          path: |
            build/native/mars_native.exe
            build/native/mars_native_game_tests.exe
            build/native/shaders/*.dxil
          if-no-files-found: error
