name: Native Renderer

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-renderer:
    name: Windows C++23 / D3D12 / HLSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate DXC
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\dxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe was not found in the Windows SDK" }
          "DXC_EXECUTABLE=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure native runtime
        shell: pwsh
        run: >-
          cmake
          -S native
          -B build/native
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDXC_EXECUTABLE="$env:DXC_EXECUTABLE"
      - name: Build native runtime and shaders
        shell: pwsh
        run: cmake --build build/native --parallel
      - name: Verify packaged shader payload
        shell: pwsh
        run: .\build\native\mars_native.exe --self-test
      - name: Upload native executable evidence
        uses: actions/upload-artifact@v4
        with:
          name: mars-native-${{ github.sha }}
          path: |
            build/native/mars_native.exe
            build/native/shaders/*.dxil
          if-no-files-found: error

  phase3-truth:
    name: Phase 3 renderer truth audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Phase 3 renderer boundary
        run: python -m tools.phase3_renderer_audit --json-out build/phase3-renderer-audit.json
      - name: Upload Phase 3 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-renderer-audit-${{ github.sha }}
          path: build/phase3-renderer-audit.json
          if-no-files-found: error
