name: Format Relay Echo candidate once

on:
  push:
    branches: [agent/phase2-relay-echo-playable-runtime]
    paths: [.github/workflows/format-relay-candidate-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-relay-echo-playable-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format changed Python files
        run: |
          python -m pip install ruff==0.16.0
          ruff format \
            game/data/relay_echo_candidate.py \
            game/scenes/relay_echo.py \
            tests/test_relay_echo_candidate.py \
            tests/test_relay_echo_candidate_audit.py \
            tools/phase2_campaign_audit.py \
            tools/relay_echo_candidate_audit.py \
            tools/relay_echo_replay.py \
            tools/relay_echo_runtime_audit.py
          ruff check --fix \
            game/data/relay_echo_candidate.py \
            game/scenes/relay_echo.py \
            tests/test_relay_echo_candidate.py \
            tests/test_relay_echo_candidate_audit.py \
            tools/phase2_campaign_audit.py \
            tools/relay_echo_candidate_audit.py \
            tools/relay_echo_replay.py \
            tools/relay_echo_runtime_audit.py
      - name: Commit formatted production tree and remove helper
        env:
          BRANCH: agent/phase2-relay-echo-playable-runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/format-relay-candidate-once.yml
          git add game tests tools
          git commit -m "Format Relay Echo playable candidate" || exit 0
          git push origin "HEAD:${BRANCH}"
