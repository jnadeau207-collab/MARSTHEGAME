name: Format truth tests

on:
  push:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Format truth tests
        run: ruff format tests/test_phase0_organization.py tests/test_phase0_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-truth-tests-${{ github.sha }}
          path: |
            tests/test_phase0_organization.py
            tests/test_phase0_audit.py
          if-no-files-found: error
