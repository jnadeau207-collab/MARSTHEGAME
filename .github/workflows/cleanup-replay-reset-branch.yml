name: Cleanup replay reset branch

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-replay-reset-branch.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/response --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent%2Fphase2-relay-echo-replay-reset")
          if [[ "$status" != "204" && "$status" != "404" && "$status" != "422" ]]; then
            cat /tmp/response
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove cleanup workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-replay-reset-branch.yml
          git commit -m "Remove replay reset branch cleanup helper"
          git push origin HEAD:main
