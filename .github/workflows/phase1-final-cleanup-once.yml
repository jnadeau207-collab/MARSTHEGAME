name: Phase 1 final cleanup once

on:
  push:
    branches: [agent/phase1-aaa-slice-foundation]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-final-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-aaa-slice-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Restore audit marker and format transition fix
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '- name: Replay all eight Classic Mode chapters'
          new = '- name: Replay all eight chapters (Classic Mode)'
          if old not in text:
              raise SystemExit('protected replay marker anchor missing')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format game/scenes/vertical_slice.py
      - name: Commit exact final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml game/scenes/vertical_slice.py
          git commit -m "Restore Phase 0 CI marker and format transition fix [phase1-final-cleanup]"
          git push origin HEAD:agent/phase1-aaa-slice-foundation
