name: Wire Relay Echo promotion CI once

on:
  push:
    branches: [agent/phase2-relay-echo-promotion]
    paths: [.github/workflows/wire-relay-promotion-ci-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-relay-echo-promotion
      - name: Add promotion replay and audit gates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "          game/core/relay_echo_accessibility.py\n          game/core/relay_echo_state.py",
                  "          game/core/relay_echo_accessibility.py\n          game/core/relay_echo_promotion.py\n          game/core/relay_echo_state.py",
              ),
              (
                  "          game/scenes/relay_echo_accessible.py\n          game/scenes/settings.py",
                  "          game/scenes/relay_echo_accessible.py\n          game/scenes/relay_echo_promoted.py\n          game/scenes/settings.py",
              ),
              (
                  "          game/core/relay_echo_accessibility.py\n          game/core/relay_echo_state.py",
                  "          game/core/relay_echo_accessibility.py\n          game/core/relay_echo_promotion.py\n          game/core/relay_echo_state.py",
              ),
              (
                  "          game/scenes/relay_echo_accessible.py\n          game/scenes/settings.py",
                  "          game/scenes/relay_echo_accessible.py\n          game/scenes/relay_echo_promoted.py\n          game/scenes/settings.py",
              ),
              (
                  "      - name: Audit Relay Echo accessibility and input parity\n        run: >-\n          python -m tools.relay_echo_accessibility_audit\n          --json-out build/relay-echo-accessibility-audit.json\n\n  phase-artifacts:",
                  "      - name: Audit Relay Echo accessibility and input parity\n        run: >-\n          python -m tools.relay_echo_accessibility_audit\n          --json-out build/relay-echo-accessibility-audit.json\n      - name: Audit Relay Echo campaign promotion\n        run: >-\n          python -m tools.relay_echo_promotion_audit\n          --json-out build/relay-echo-promotion-audit.json\n\n  phase-artifacts:",
              ),
              (
                  "      - name: Prove Relay Echo accessibility and input parity\n        run: >-\n          python -m tools.relay_echo_accessibility_replay\n          --json-out build/relay-echo-accessibility-replay.json\n      - name: Capture performance evidence",
                  "      - name: Prove Relay Echo accessibility and input parity\n        run: >-\n          python -m tools.relay_echo_accessibility_replay\n          --json-out build/relay-echo-accessibility-replay.json\n      - name: Replay Relay Echo campaign promotion\n        run: >-\n          python -m tools.relay_echo_promotion_replay\n          --json-out build/relay-echo-promotion-replay.json\n      - name: Capture performance evidence",
              ),
              (
                  "      - name: Audit Relay Echo accessibility and input parity\n        run: >-\n          python -m tools.relay_echo_accessibility_audit\n          --json-out build/relay-echo-accessibility-audit.json\n      - name: Upload Phase evidence",
                  "      - name: Audit Relay Echo accessibility and input parity\n        run: >-\n          python -m tools.relay_echo_accessibility_audit\n          --json-out build/relay-echo-accessibility-audit.json\n      - name: Audit Relay Echo campaign promotion\n        run: >-\n          python -m tools.relay_echo_promotion_audit\n          --json-out build/relay-echo-promotion-audit.json\n      - name: Upload Phase evidence",
              ),
              (
                  "            build/relay-echo-accessibility-replay.json\n            build/performance-baseline.json",
                  "            build/relay-echo-accessibility-replay.json\n            build/relay-echo-promotion-replay.json\n            build/performance-baseline.json",
              ),
              (
                  "            build/relay-echo-accessibility-audit.json\n          if-no-files-found: warn",
                  "            build/relay-echo-accessibility-audit.json\n            build/relay-echo-promotion-audit.json\n          if-no-files-found: warn",
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"CI insertion point missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit production CI and remove helper
        env:
          BRANCH: agent/phase2-relay-echo-promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/wire-relay-promotion-ci-once.yml
          git add .github/workflows/ci.yml
          git commit -m "Gate Relay Echo campaign promotion in CI" || exit 0
          git push origin "HEAD:${BRANCH}"
