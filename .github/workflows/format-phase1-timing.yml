name: Format Phase 1 timing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply pinned formatter
        run: >-
          ruff format
          game/core/engine.py
          game/core/input.py
          game/core/timing.py
          tools/phase1_quality_audit.py
          tests/test_input_manager.py
          tests/test_timing.py
      - name: Capture exact patch
        run: |
          mkdir -p build
          git diff --binary > build/phase1-timing-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-phase1-timing-${{ github.sha }}
          path: |
            build/phase1-timing-format.patch
            game/core/engine.py
            game/core/input.py
            game/core/timing.py
            tools/phase1_quality_audit.py
            tests/test_input_manager.py
            tests/test_timing.py
          if-no-files-found: error
