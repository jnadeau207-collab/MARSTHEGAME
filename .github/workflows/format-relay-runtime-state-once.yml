name: Format Relay Echo runtime state once

on:
  push:
    branches: [agent/phase2-relay-echo-runtime-state]
    paths:
      - .github/workflows/format-relay-runtime-state-once.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[relay-runtime-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-relay-echo-runtime-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.0
      - name: Apply canonical formatting
        run: >-
          ruff format
          game/core/relay_echo_state.py
          game/core/save.py
          tools/phase2_campaign_audit.py
          tools/relay_echo_runtime_audit.py
          tests/test_phase2_campaign_audit.py
          tests/test_relay_echo_runtime_audit.py
          tests/test_relay_echo_save.py
          tests/test_relay_echo_state.py
      - name: Commit formatted production files and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/format-relay-runtime-state-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game/core/relay_echo_state.py game/core/save.py tools/phase2_campaign_audit.py tools/relay_echo_runtime_audit.py tests/test_phase2_campaign_audit.py tests/test_relay_echo_runtime_audit.py tests/test_relay_echo_save.py tests/test_relay_echo_state.py .github/workflows/format-relay-runtime-state-once.yml
          git commit -m 'Format Relay Echo runtime-state files [relay-runtime-format]'
          git push origin HEAD:agent/phase2-relay-echo-runtime-state
