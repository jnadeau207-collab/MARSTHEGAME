name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Compile all Python sources
        run: python -m compileall -q main.py game tools tests
      - name: Static analysis ratchet
        run: >-
          ruff check
          game/core/accessibility.py
          game/core/audio.py
          game/core/camera.py
          game/core/campaign.py
          game/core/checkpoint.py
          game/core/diagnostics.py
          game/core/engine.py
          game/core/gfx.py
          game/core/input.py
          game/core/presentation.py
          game/core/save.py
          game/core/settings.py
          game/core/timing.py
          game/data/campaign.py
          game/data/classic_replays.py
          game/data/content.py
          game/data/ip_tracks.py
          game/data/phase1_slice.py
          game/entities/mars_sentinel.py
          game/scenes/campaign.py
          game/scenes/credits.py
          game/scenes/title.py
          game/scenes/vertical_slice.py
          tools
          tests
      - name: Formatting data and replay contracts
        run: >-
          ruff format --check
          game/data/campaign.py
          game/data/classic_replays.py
          game/data/content.py
          game/data/ip_tracks.py
          game/data/phase1_slice.py
      - name: Formatting core runtime
        run: >-
          ruff format --check
          game/core/accessibility.py
          game/core/audio.py
          game/core/camera.py
          game/core/campaign.py
          game/core/checkpoint.py
          game/core/diagnostics.py
          game/core/engine.py
          game/core/gfx.py
          game/core/input.py
          game/core/presentation.py
          game/core/save.py
          game/core/settings.py
          game/core/timing.py
      - name: Formatting campaign and gameplay scenes
        run: >-
          ruff format --check
          game/entities/mars_sentinel.py
          game/scenes/campaign.py
          game/scenes/credits.py
          game/scenes/title.py
          game/scenes/vertical_slice.py
      - name: Formatting replay, audit, and benchmark tools
        run: ruff format --check tools
      - name: Formatting regression tests
        run: ruff format --check tests
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate founder + AI operating model
        run: >-
          python -m tools.validate_phase0_organization
          --json-out build/phase0-organization.json
      - name: Audit Phase 0 completion
        run: python -m tools.phase0_audit --json-out build/phase0-audit.json
      - name: Audit Phase 1 quality truth
        run: python -m tools.phase1_quality_audit --json-out build/phase1-quality.json
      - name: Audit Phase 2 campaign truth
        run: python -m tools.phase2_campaign_audit --json-out build/phase2-campaign.json

  phase-artifacts:
    name: Classic Mode, Phase 1, and Phase 2 evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Replay all eight chapters (Classic Mode)
        run: python -m tools.classic_mode_replay --json-out build/classic-mode-replay.json
      - name: Replay the complete Phase 1 slice
        run: python -m tools.phase1_slice_replay --json-out build/phase1-slice-replay.json
      - name: Capture performance evidence
        run: >-
          python -m tools.performance_baseline
          --update-frames 90
          --draw-frames 5
          --warmup-rounds 2
          --rounds 7
          --json-out build/performance-baseline.json
      - name: Validate founder + AI operating model
        run: >-
          python -m tools.validate_phase0_organization
          --json-out build/phase0-organization.json
      - name: Audit Phase 0 completion
        run: python -m tools.phase0_audit --json-out build/phase0-audit.json
      - name: Audit Phase 1 quality truth
        run: python -m tools.phase1_quality_audit --json-out build/phase1-quality.json
      - name: Audit Phase 2 campaign truth
        run: python -m tools.phase2_campaign_audit --json-out build/phase2-campaign.json
      - name: Upload Phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-evidence-${{ github.sha }}
          path: |
            build/classic-mode-replay.json
            build/phase1-slice-replay.json
            build/performance-baseline.json
            build/phase0-organization.json
            build/phase0-audit.json
            build/phase1-quality.json
            build/phase2-campaign.json
          if-no-files-found: warn

  performance-regression:
    name: Same-runner performance guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip -r candidate/requirements.txt
      - name: Install benchmark harness into base revision
        run: |
          mkdir -p baseline/tools evidence
          cp candidate/tools/performance_baseline.py baseline/tools/performance_baseline.py
          touch baseline/tools/__init__.py
      - name: Capture first base measurement
        working-directory: baseline
        env:
          GITHUB_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python -m tools.performance_baseline
          --update-frames 90
          --draw-frames 5
          --warmup-rounds 2
          --rounds 7
          --json-out ../evidence/base-a.json
      - name: Capture candidate measurement
        working-directory: candidate
        run: >-
          python -m tools.performance_baseline
          --update-frames 90
          --draw-frames 5
          --warmup-rounds 2
          --rounds 7
          --json-out ../evidence/candidate.json
      - name: Capture second base measurement
        working-directory: baseline
        env:
          GITHUB_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python -m tools.performance_baseline
          --update-frames 90
          --draw-frames 5
          --warmup-rounds 2
          --rounds 7
          --json-out ../evidence/base-b.json
      - name: Enforce performance regression policy
        working-directory: candidate
        run: >-
          python -m tools.performance_guard
          --baseline ../evidence/base-a.json
          --baseline ../evidence/base-b.json
          --candidate ../evidence/candidate.json
          --policy config/performance_thresholds.json
          --json-out ../evidence/performance-guard.json
      - name: Upload performance comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-guard-${{ github.sha }}
          path: evidence/*.json
          if-no-files-found: warn

  phase2-integration-evidence:
    name: Phase 2 exact integration evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply integration patch in evidence workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          scene = Path('game/scenes/vertical_slice.py')
          text = scene.read_text(encoding='utf-8')
          old = '''            self.engine.save.update_phase1_slice(
                checkpoint_id=self.current_checkpoint,
                failures=self.failure_count,
                best_phase="complete",
                completed=True,
                resource_gate_open=self.resource_gate_open,
            )
            self.engine.save.save()
'''
          new = '''            self.engine.save.update_phase1_slice(
                checkpoint_id=self.current_checkpoint,
                failures=self.failure_count,
                best_phase="complete",
                completed=True,
                resource_gate_open=self.resource_gate_open,
            )
            self.engine.save.complete_campaign_mission("ares_reach")
            self.engine.save.save()
'''
          if old not in text:
              raise SystemExit('Phase 1 completion anchor missing')
          scene.write_text(text.replace(old, new, 1), encoding='utf-8')

          replay = Path('tools/phase1_slice_replay.py')
          text = replay.read_text(encoding='utf-8')
          old = '''            "save": dict(self.engine.save.phase1_slice),
            "save_generation": self.engine.save.generation,
'''
          new = '''            "save": dict(self.engine.save.phase1_slice),
            "campaign": json.loads(json.dumps(self.engine.save.campaign, sort_keys=True)),
            "save_generation": self.engine.save.generation,
'''
          if old not in text:
              raise SystemExit('Phase 1 replay signature anchor missing')
          replay.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_phase1_slice.py')
          text = test.read_text(encoding='utf-8')
          old = '''        self.assertTrue(reference["save"]["completed"])
        self.assertEqual(reference["transition"], ["title"])
'''
          new = '''        self.assertTrue(reference["save"]["completed"])
        self.assertEqual(reference["campaign"]["completed_missions"], ["ares_reach"])
        self.assertIn("relay_echo", reference["campaign"]["unlocked_missions"])
        self.assertEqual(reference["transition"], ["title"])
'''
          if old not in text:
              raise SystemExit('Phase 1 test campaign anchor missing')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          campaign = Path('game/core/campaign.py')
          text = campaign.read_text(encoding='utf-8')
          old = '''        if not isinstance(prerequisites, (tuple, list)):
            errors.append(f"mission {mission_id} prerequisites must be a sequence")
        elif len(prerequisites) != len(set(prerequisites)):
            errors.append(f"mission {mission_id} has duplicate prerequisites")
'''
          new = '''        if not isinstance(prerequisites, (tuple, list)):
            errors.append(f"mission {mission_id} prerequisites must be a sequence")
        elif not all(isinstance(item, str) for item in prerequisites):
            errors.append(f"mission {mission_id} prerequisites must contain only mission ids")
        elif len(prerequisites) != len(set(prerequisites)):
            errors.append(f"mission {mission_id} has duplicate prerequisites")
'''
          if old not in text:
              raise SystemExit('Campaign validation anchor missing')
          campaign.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply pinned formatting
        run: >-
          ruff format
          game/core/campaign.py
          game/core/engine.py
          game/core/save.py
          game/data/campaign.py
          game/scenes/campaign.py
          game/scenes/title.py
          game/scenes/vertical_slice.py
          tools/phase1_slice_replay.py
          tools/phase2_campaign_audit.py
          tests/test_campaign.py
          tests/test_campaign_save.py
          tests/test_phase1_slice.py
          tests/test_phase2_campaign_audit.py
      - name: Verify integrated workspace
        run: |
          ruff check game/core/campaign.py game/core/engine.py game/core/save.py game/data/campaign.py game/scenes/campaign.py game/scenes/title.py game/scenes/vertical_slice.py tools tests
          python -m unittest tests.test_campaign tests.test_campaign_save tests.test_phase1_slice tests.test_phase2_campaign_audit -v
          python -m tools.phase1_slice_replay --json-out build/phase1-slice-replay.json
          python -m tools.phase2_campaign_audit --json-out build/phase2-campaign.json
      - name: Capture exact files and patch
        run: |
          mkdir -p build/phase2-integration
          git diff --binary > build/phase2-integration.patch
          cp --parents \
            game/core/campaign.py \
            game/core/engine.py \
            game/core/save.py \
            game/data/campaign.py \
            game/scenes/campaign.py \
            game/scenes/title.py \
            game/scenes/vertical_slice.py \
            tools/phase1_slice_replay.py \
            tools/phase2_campaign_audit.py \
            tests/test_campaign.py \
            tests/test_campaign_save.py \
            tests/test_phase1_slice.py \
            tests/test_phase2_campaign_audit.py \
            build/phase2-integration/
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-integration-${{ github.sha }}
          path: |
            build/phase2-integration.patch
            build/phase2-integration/
          if-no-files-found: error
